<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — Diskominfo Kota Bogor</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--slate-100);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.5rem 1.5rem;
    }

    .auth-wrapper {
      background: white;
      width: 100%;
      max-width: 1000px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: row-reverse; /* Banner di kanan */
      overflow: hidden;
      border: 1px solid white;
      min-height: auto;
    }

    /* Right Side (Banner with Illustration) */
    .auth-banner {
      flex: 1.1;
      background: url("../tugu.jpg") center/cover no-repeat;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--slate-900);
      position: relative;
    }
    
    .auth-banner img {
      max-width: 60%;
      max-height: 150px;
      object-fit: contain;
      height: auto;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 20px 30px rgba(2, 132, 199, 0.15));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    .banner-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.3;
      text-align: center;
    }
    
    .banner-subtitle {
      font-size: 1.05rem;
      color: var(--slate-600);
      line-height: 1.6;
      text-align: center;
      max-width: 85%;
    }

    /* Left Side (Form) */
    .auth-form-container {
      flex: 1;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      position: relative;
    }

    .link-back-clean {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--slate-500);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }
    .link-back-clean:hover {
      color: var(--slate-900);
    }

    /* Logo at the top of the form */
    .brand-logo {
      width: 80px;
      margin-bottom: 0.5rem;
      display: block;
    }

    .auth-header {
      margin-bottom: 0.75rem;
    }
    .auth-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 0.5rem;
    }
    .auth-header p {
      color: var(--slate-500);
      font-size: 0.95rem;
    }

    /* Modern Form Inputs */
    .form-group-modern {
      position: relative;
      margin-bottom: 0.75rem;
    }
    .form-group-modern label {
      display: block;
      font-weight: 600;
      color: var(--slate-700);
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-400);
      display: flex;
      align-items: center;
    }
    .input-with-icon .form-control {
      padding-left: 3rem;
    }
    .form-control {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--slate-200);
      font-size: 0.95rem;
      color: var(--slate-800);
      background-color: var(--slate-50);
      transition: all 0.2s;
    }
    .form-control:focus {
      background-color: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px #e0f2fe;
      outline: none;
    }

    .btn-auth {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-auth:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.95rem;
      color: var(--slate-500);
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 991px) {
      .page-wrapper { padding: 2rem 1.5rem; }
      .auth-wrapper { 
        max-width: 600px; 
        min-height: auto; 
        flex-direction: column; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
      }
      .auth-banner { 
        flex: none; 
        padding: 2.5rem 2rem 2rem; 
      }
      .auth-banner img {
        max-width: 200px;
        margin-bottom: 1.5rem;
      }
      .banner-title { font-size: 1.8rem; margin-bottom: 0.5rem; }
      .banner-subtitle { font-size: 0.95rem; max-width: 100%; }
      .auth-form-container { padding: 3rem 2.5rem; border-radius: 0 0 24px 24px; }
    }
    
    @media (max-width: 576px) {
      .page-wrapper { padding: 1rem 24px; }
      .auth-wrapper { border-radius: 20px; width: 100%; box-shadow: none; background: transparent; }
      .auth-banner { display: none !important; }
      .auth-form-container { padding: 2rem 24px; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
      .auth-header h2 { font-size: 1.4rem; }
      .brand-logo { width: 110px; margin-bottom: 1.5rem; }
      .form-control, .form-select { padding: 12px 16px; font-size: 0.95rem; border-radius: 10px; }
      .btn-auth { padding: 0.85rem; font-size: 0.95rem; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="auth-wrapper">
    <!-- Banner with Illustration (Right Side) -->
    <div class="auth-banner">
      <img src="../magang_illustration.png" alt="Ilustrasi Registrasi">
      <h1 class="banner-title">Mulai Perjalanan Anda.</h1>
      <p class="banner-subtitle">Dapatkan akses ke seluruh fasilitas dan layanan digital dari Dinas Komunikasi dan Informatika Kota Bogor secara gratis dan terpadu.</p>
    </div>

    <!-- Form Register (Left Side) -->
    <div class="auth-form-container">
      <a href="../index.html" class="link-back-clean">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Kembali ke Beranda
      </a>

      <!-- Logo Instansi -->
      <img src="../logo2.png" alt="Logo Diskominfo" class="brand-logo">

      <div class="auth-header">
        <h2>Daftar Akun Baru</h2>
        <p>Lengkapi data di bawah ini untuk mendaftar.</p>
      </div>

      <form onsubmit="event.preventDefault(); simulateRegister();">
        
        <div class="form-group-modern">
          <label>Nama Lengkap</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
            <input type="text" class="form-control" name="name" placeholder="Sesuai KTP" required>
          </div>
        </div>

        <div class="form-group-modern">
          <label>Alamat Email</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span>
            <input type="email" class="form-control" name="email" placeholder="nama@email.com" required>
          </div>
        </div>

        <div class="form-group-modern">
          <label>Kata Sandi</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <input type="password" class="form-control" name="password" placeholder="Minimal 8 karakter" required>
          </div>
        </div>

        <div class="form-group-modern">
          <label>Konfirmasi Sandi</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <input type="password" class="form-control" name="password_confirmation" placeholder="Ulangi kata sandi" required>
          </div>
        </div>

        <button type="submit" class="btn-auth">
          Buat Akun Saya
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function simulateRegister() {
      Swal.fire({
        title: 'Memproses...',
        text: 'Sedang mendaftarkan akun Anda',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });
      setTimeout(() => {
        Swal.fire({
          icon: 'success',
          title: 'Pendaftaran Berhasil!',
          text: 'Akun Anda telah dibuat. Silakan masuk.',
          confirmButtonColor: '#0284c7',
          timer: 2000,
          showConfirmButton: false
        }).then(() => {
          window.location.href = "login.html";
        });
      }, 1500);
    }
  </script>
</body>
</html>
