<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Diskominfo Kota Bogor</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }
    
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--slate-100);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.5rem 1.5rem;
    }

    .auth-wrapper {
      background: white;
      width: 100%;
      max-width: 1000px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      display: flex;
      overflow: hidden;
      border: 1px solid white;
      min-height: auto;
    }

    .auth-banner {
      flex: 1.1;
      background: url("../tugu.jpg") center/cover no-repeat;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Teks agak ke bawah agar bagian atas foto terlihat jelas */
      color: white;
      position: relative;
    }
    
    /* Overlay Gelap/Biru agar teks mudah dibaca */
    .auth-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(2, 132, 199, 0.2) 100%);
      pointer-events: none;
    }

    .banner-content {
      position: relative;
      z-index: 2;
    }

    .banner-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    .banner-subtitle {
      font-size: 1.05rem;
      opacity: 0.85;
      line-height: 1.6;
      max-width: 90%;
    }

    /* Right Side (Form) */
    .auth-form-container {
      flex: 1;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      position: relative;
    }

    .link-back-clean {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--slate-500);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }
    .link-back-clean:hover {
      color: var(--slate-900);
    }

    /* Logo at the top of the form */
    .brand-logo {
      width: 80px;
      margin-bottom: 0.5rem;
      display: block;
    }

    .auth-header {
      margin-bottom: 0.75rem;
    }
    .auth-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      color: var(--slate-500);
      font-size: 0.9rem;
      margin-bottom: 0;
    }

    /* Modern Form Inputs */
    .form-group-modern {
      position: relative;
      margin-bottom: 0.75rem;
    }
    .form-group-modern label {
      display: block;
      font-weight: 600;
      color: var(--slate-700);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-400);
      display: flex;
      align-items: center;
    }
    .input-with-icon .form-control {
      padding-left: 3rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--slate-200);
      font-size: 0.95rem;
      color: var(--slate-800);
      background-color: var(--slate-50);
      transition: all 0.2s;
    }
    .form-control:focus {
      background-color: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px #e0f2fe;
      outline: none;
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    .form-check-label {
      color: var(--slate-600);
      cursor: pointer;
    }
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--primary-hover); }

    .btn-auth {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-auth:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--slate-500);
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 991px) {
      .page-wrapper { padding: 2rem 1.5rem; }
      .auth-wrapper { 
        max-width: 600px; 
        min-height: auto; 
        flex-direction: column; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
      }
      .auth-banner { 
        flex: none; 
        height: 220px; 
        padding: 2rem; 
        justify-content: center;
      }
      .banner-title { font-size: 1.8rem; margin-bottom: 0.5rem; }
      .banner-subtitle { font-size: 0.95rem; max-width: 100%; }
      .auth-form-container { padding: 3rem 2.5rem; border-radius: 0 0 24px 24px; }
    }
    
    @media (max-width: 576px) {
      .page-wrapper { padding: 1rem 24px; }
      .auth-wrapper { border-radius: 20px; width: 100%; box-shadow: none; background: transparent; }
      .auth-banner { display: none !important; }
      .auth-form-container { padding: 2rem 24px; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
      .auth-header h2 { font-size: 1.4rem; }
      .brand-logo { width: 110px; margin-bottom: 1.5rem; }
      .form-control, .form-select { padding: 12px 16px; font-size: 0.95rem; border-radius: 10px; }
      .btn-auth { padding: 0.85rem; font-size: 0.95rem; border-radius: 12px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="auth-wrapper">
    <!-- Banner with Photo (Left Side) -->
    <div class="auth-banner">
      <div class="banner-content">
        <h1 class="banner-title">Layanan Digital<br>Terintegrasi.</h1>
        <p class="banner-subtitle">Masuk untuk mengelola pengajuan magang, izin penelitian, jadwal zoom, dan publikasi jurnal Anda dengan mudah dan cepat.</p>
      </div>
    </div>

    <!-- Form Login (Right Side) -->
    <div class="auth-form-container">
      
      <a href="../index.html" class="link-back-clean">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Kembali ke Beranda
      </a>

      <!-- Logo Instansi -->
      <img src="../logo2.png" alt="Logo Diskominfo" class="brand-logo">

      <div class="auth-header">
        <h2>Selamat Datang</h2>
        <p>Silakan masuk ke akun Anda untuk melanjutkan.</p>
      </div>

      <form onsubmit="event.preventDefault(); simulateLogin();">
        
        <div class="form-group-modern">
          <label>Alamat Email</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span>
            <input type="email" class="form-control" name="email" placeholder="nama@email.com" required>
          </div>
        </div>

        <div class="form-group-modern">
          <label>Kata Sandi</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Role Selection Removed Temporarily -->

        <div class="form-options">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Ingat Saya</label>
          </div>
          <a href="#" class="forgot-link">Lupa Sandi?</a>
        </div>

        <button type="submit" class="btn-auth">
          Masuk Sekarang
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar di sini</a>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Hapus sesi lama setiap kali membuka halaman login
    localStorage.removeItem('isLoggedIn');

    function simulateLogin() {
      Swal.fire({
        title: 'Memproses...',
        text: 'Sedang masuk ke akun Anda',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });
      setTimeout(() => {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Masuk',
          text: 'Selamat datang kembali!',
          confirmButtonColor: '#0284c7',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          localStorage.setItem('isLoggedIn', 'true');
          window.location.href = "../index.html";
        });
      }, 1000);
    }
  </script>
</body>
</html>
