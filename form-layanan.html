<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pengajuan — Diskominfo Kota Bogor</title>

    <!-- Cek Status Login Prototipe -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "auth/login.html";
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --primary-border: #bae6fd;
        }

        body {
            overflow-x: hidden;
            width: 100%;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Back button */
        .btn-back-sticky {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #e2e8f0;
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1050;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .btn-back-sticky:hover {
            background: #ffffff;
            border-color: var(--primary);
            color: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.2);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, rgba(224, 242, 254, 0.5) 0%, rgba(255, 255, 255, 0) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .form-card {
            padding: 3.5rem 4rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            background: #ffffff;
            margin: 60px auto;
            max-width: 950px;
        }

        .form-label {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #475569;
        }

        .form-control,
        .form-select {
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
            outline: none;
        }

        /* Custom File Input Styling */
        input[type="file"] {
            padding: 0.5rem 1rem !important;
        }

        input[type="file"]::file-selector-button {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            margin-right: 1.2rem;
            color: #334155;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .form-text {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            padding: 13px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.2);
        }

        /* --- Profesional Responsive Adjustments --- */
        
        /* Tablet & Large Mobile */
        @media (max-width: 992px) {
            .form-card {
                margin: 50px auto 40px auto;
                padding: 2.5rem;
                max-width: 90%;
            }

            .btn-back-sticky {
                top: 20px;
                left: 20px;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container { padding-left: 0 !important; padding-right: 0 !important; }

            .btn-back-sticky {
                top: 24px;
                left: 24px;
                width: 44px;
                height: 44px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                background: rgba(255, 255, 255, 0.95);
            }

            .form-card {
                padding: 2rem 24px;
                margin: 70px 0 0 0;
                border-radius: 24px 24px 0 0;
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.05);
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.9);
            }

            .btn-submit {
                width: 100%;
                padding: 12px;
                font-size: 0.95rem;
                border-radius: 12px;
                box-shadow: 0 6px 15px -4px rgba(2, 132, 199, 0.3);
            }

            .form-control,
            .form-select {
                font-size: 0.95rem;
                padding: 10px 14px;
                border-radius: 12px;
                background-color: #f8fafc;
                border: 1px solid #e2e8f0;
            }

            .form-control:focus {
                background-color: #fff;
                box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
            }

            h4.fw-bold {
                font-size: 1.6rem !important;
                letter-spacing: -0.02em;
            }

            h5.fw-semibold {
                font-size: 1.15rem !important;
            }

            .form-label {
                font-size: 0.9rem;
                margin-bottom: 0.4rem;
                color: #334155;
            }
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="index.html" class="btn-back-sticky" title="Kembali ke Portal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <section class="section position-relative" style="z-index: 2;">
        <div class="container position-relative z-1" style="max-width: 1100px;">

            <div class="form-card" data-aos="fade-up">

                <div class="row g-4 justify-content-center">
                    <div class="col-lg-12">
                        <div style="padding-bottom: 1.5rem; margin-bottom: 2.5rem;">
                            <h4 class="fw-bold text-center mb-1"
                                style="font-size: 1.8rem; color: #0f172a; letter-spacing: -0.5px;">Formulir Pendaftaran
                            </h4>
                            <h5 class="text-center fw-semibold" id="form-subtitle"
                                style="color: var(--primary); font-size: 1.2rem;">Layanan Umum</h5>
                        </div>

                        <form action="" method="POST" id="mainForm">
                            <input type="hidden" name="layanan" id="input-layanan-hidden" value="">

                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nama Lengkap</label>
                                    <input type="text" name="nama" class="form-control" required
                                        placeholder="Sesuai Identitas">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Aktif</label>
                                    <input type="email" name="email" class="form-control" required
                                        placeholder="email@domain.com">
                                </div>
                            </div>

                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">No. WhatsApp</label>
                                    <input type="tel" name="no_whatsapp" class="form-control" required
                                        placeholder="08xxxxxxxxxx">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Asal Instansi / Lembaga</label>
                                    <input type="text" name="instansi" class="form-control" required
                                        placeholder="Nama Instansi/Perangkat Daerah">
                                </div>
                            </div>

                            <!-- Dynamic Fields Container -->
                            <div class="row g-4 mb-4" id="dynamic-fields-container"></div>

                            <div class="mb-4">
                                <label class="form-label">Perihal Singkat</label>
                                <input type="text" name="perihal" class="form-control" required
                                    placeholder="Intisari permohonan">
                            </div>

                            <div class="mb-5">
                                <label class="form-label">Surat Pengantar / Surat Permohonan (PDF)</label>
                                <input class="form-control" name="dokumen" type="file" accept=".pdf" required
                                    style="padding: 0.6rem 1rem;">
                                <div class="form-text mt-1">Maks 5MB, format .pdf</div>
                            </div>

                            <div class="mt-4 text-center">
                                <button type="button" class="btn-submit px-5 py-3" id="btn-submit-form"
                                    onclick="submitSimulasi()">Kirim Permohonan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        AOS.init({ once: true, duration: 800, offset: 100, easing: 'ease-out-quart' });

        // Extract Layanan from URL Parameter
        const urlParams = new URLSearchParams(window.location.search);
        let layananParam = urlParams.get('layanan') || 'Layanan Publik';

        // Update Subtitle and hidden input
        document.getElementById('form-subtitle').innerText = layananParam === 'Layanan Publik' ? 'Layanan Umum' : layananParam;
        document.getElementById('input-layanan-hidden').value = layananParam;

        if (layananParam !== 'Layanan Publik') {
            document.getElementById('btn-submit-form').innerText = 'Kirim Permohonan';
        } else {
            document.getElementById('btn-submit-form').innerText = 'Kirim Permohonan Layanan';
        }

        const layanan_lower = layananParam.toLowerCase();
        let fields = [];

        // Match conditions similar to Laravel PHP logic
        if (layanan_lower.includes('zoom')) {
            fields = [
                { name: 'tanggal_mulai', label: 'Tanggal & Waktu Pelaksanaan', type: 'datetime-local', placeholder: '' },
                { name: 'jumlah_peserta', label: 'Perkiraan Jumlah Peserta', type: 'number', placeholder: 'Misal: 100' },
            ];
        } else if (layanan_lower.includes('sdm')) {
            fields = [
                { name: 'topik_materi', label: 'Topik / Materi yang Dibutuhkan', type: 'text', placeholder: 'Misal: Pelatihan Penggunaan Aplikasi X' },
                { name: 'target_peserta', label: 'Target Peserta', type: 'text', placeholder: 'Misal: Seluruh Pegawai OPD' },
            ];
        } else if (layanan_lower.includes('jaringan') || layanan_lower.includes('wifi')) {
            fields = [
                { name: 'lokasi_titik', label: 'Lokasi Pemasangan / Gangguan', type: 'text', placeholder: 'Nama gedung, lantai, atau ruangan' },
                { name: 'jenis_perangkat', label: 'Jenis Perangkat (Jika Ada)', type: 'text', placeholder: 'Misal: Router, Switch, Akses Point' },
            ];
        } else if (layanan_lower.includes('server') || layanan_lower.includes('infrastruktur')) {
            fields = [
                { name: 'spesifikasi', label: 'Kebutuhan Spesifikasi Sistem', type: 'text', placeholder: 'vCPU, RAM, Storage, OS (Misal: 4 Core, 8GB RAM, Ubuntu)' },
            ];
        } else if (layanan_lower.includes('kebijakan') || layanan_lower.includes('monev')) {
            fields = [
                { name: 'opd_terkait', label: 'OPD Terkait', type: 'text', placeholder: 'Nama OPD / Instansi' },
            ];
        } else if (layanan_lower.includes('password') && layanan_lower.includes('website')) {
            fields = [
                { name: 'url_website', label: 'URL Website', type: 'url', placeholder: 'https://...' },
                { name: 'username_target', label: 'Username Akun', type: 'text', placeholder: 'Username yang bermasalah' },
            ];
        } else if (layanan_lower.includes('password')) {
            fields = [
                { name: 'akun_target', label: 'Alamat Email / NIK Target', type: 'text', placeholder: 'Masukkan email / NIK akun terkait' },
            ];
        } else if (layanan_lower.includes('security') || layanan_lower.includes('soc') || layanan_lower.includes('csirt') || layanan_lower.includes('vapt') || layanan_lower.includes('uks') || layanan_lower.includes('dsa')) {
            fields = [
                { name: 'target_sistem', label: 'Nama Aplikasi / Domain Terkait', type: 'text', placeholder: 'Misal: simpeg.bogorkota.go.id atau Alamat IP' },
            ];
        }

        // Render Dynamic Fields
        const container = document.getElementById('dynamic-fields-container');
        if (fields.length > 0) {
            fields.forEach(field => {
                const colClass = fields.length === 1 ? 'col-md-12' : 'col-md-6';
                const html = `
              <div class="${colClass}">
                <label class="form-label">${field.label}</label>
                <input type="${field.type}" name="${field.name}" class="form-control" required placeholder="${field.placeholder}">
              </div>
            `;
                container.innerHTML += html;
            });
        }

        // SweetAlert for Simulation
        function submitSimulasi() {
            const form = document.getElementById('mainForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Simulate loading
            Swal.fire({
                title: 'Memproses Pengajuan...',
                html: 'Sistem sedang memverifikasi data dan dokumen Anda.',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            setTimeout(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Pengajuan Terkirim!',
                    text: 'Nomor Tiket Anda: TKT-' + Math.floor(1000 + Math.random() * 9000) + '-23. Simpan nomor ini untuk melacak status.',
                    confirmButtonColor: 'var(--primary)',
                    confirmButtonText: 'Tutup & Kembali'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "index.html";
                    }
                });
            }, 1500);
        }
    </script>
</body>

</html>
